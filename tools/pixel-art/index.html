<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Creator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Pixel Art Creator</h1>
        <div id="pixel-art-container"></div>
        <div class="controls">
            <label for="matrix-size">Matrix Size:</label>
            <input type="number" id="matrix-size" value="44" min="1" max="100">
            <button id="resize-btn">Resize</button>
        </div>
        <div id="color-palette">
            <!-- Colors will be dynamically generated -->
        </div>
        <button id="save-btn">Save as JSON</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
